# CloudQuery AWS Sync Configuration
# Collects S3, CloudTrail, and IAM evidence for compliance controls.
#
# Usage: cloudquery sync examples/cloudquery/aws_sync.yml

kind: source
spec:
  name: aws
  path: cloudquery/aws
  registry: cloudquery
  version: "v28.5.0"
  tables:
    - aws_s3_buckets
    - aws_cloudtrail_trails
    - aws_iam_policies
    - aws_iam_roles
    - aws_kms_keys
    - aws_cloudwatch_log_groups
  destinations:
    - file-json

---
kind: destination
spec:
  name: file-json
  path: cloudquery/file
  registry: cloudquery
  version: "v5.1.0"
  spec:
    path: "./evidence"
    format: json
    no_rotate: true
