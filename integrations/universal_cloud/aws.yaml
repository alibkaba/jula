vendor_name: "aws"
provider: "aws"                  # Primary routing discriminator key
auth_flow:
  type: "aws_sigv4"              # Leverages pure-Go SigV4 request interceptor
endpoints:
  "https://config.${AWS_REGION}.amazonaws.com/":
    method: "POST"
    erl_id: "E-AWS-INVENTORY"
    description: "Query global AWS resource states via POST query gateway"
    body:
      Expression: "SELECT resourceId, resourceType, configuration, tags WHERE resourceType IN ('AWS::EC2::Instance', 'AWS::RDS::DBInstance', 'AWS::S3::Bucket')"
