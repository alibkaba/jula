# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "gomod"
    directory: "/collector"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "gomod"
    directory: "/assessor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "gomod"
    directory: "/governor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "gomod"
    directory: "/reporter"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "
