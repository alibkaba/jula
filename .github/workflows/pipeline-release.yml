name: "CI/CD: Monorepo Release"

on:
  push:
    branches:
      - main

permissions: {}

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: jula

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      collector_released: ${{ steps.release.outputs.collector--release_created }}
      collector_tag: ${{ steps.release.outputs.collector--tag_name }}
      evaluator_released: ${{ steps.release.outputs.evaluator--release_created }}
      evaluator_tag: ${{ steps.release.outputs.evaluator--tag_name }}
      governor_released: ${{ steps.release.outputs.governor--release_created }}
      governor_tag: ${{ steps.release.outputs.governor--tag_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Release Please (Monorepo)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # ==============================================================
  # COLLECTOR ARTIFACTS
  # ==============================================================
  release-collector:
    needs: release-please
    if: ${{ needs.release-please.outputs.collector_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify GCP infrastructure
        run: |
          if ! gcloud artifacts repositories describe jula-collector \
              --project=${{ env.GCP_PROJECT_ID }} --location=${{ env.GCP_REGION }} \
              --quiet 2>/dev/null; then
            echo "::warning::GCP infrastructure not deployed. Skipping image tagging."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Tag Docker image with SemVer (GCP)
        if: env.SKIP_DEPLOY != 'true'
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-collector/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-collector/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.collector_tag }} \
            --quiet

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "collector/go.mod"
          cache: false

      - name: Build macOS Binary (ARM64)
        run: GOOS=darwin GOARCH=arm64 go build -o build/jula-collector-darwin-arm64 ./collector/cmd/collector

      - name: Build Linux Binary (AMD64)
        run: GOOS=linux GOARCH=amd64 go build -o build/jula-collector-linux-amd64 ./collector/cmd/collector

      - name: Build Windows Binary (AMD64)
        run: GOOS=windows GOARCH=amd64 go build -o build/jula-collector-windows-amd64.exe ./collector/cmd/collector

      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.collector_tag }} \
            build/jula-collector-darwin-arm64 \
            build/jula-collector-linux-amd64 \
            build/jula-collector-windows-amd64.exe

      - name: Attest Build Provenance (Collector Binaries)
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: |
            build/jula-collector-darwin-arm64
            build/jula-collector-linux-amd64
            build/jula-collector-windows-amd64.exe

  # ==============================================================
  # EVALUATOR ARTIFACTS
  # ==============================================================
  release-evaluator:
    needs: release-please
    if: ${{ needs.release-please.outputs.evaluator_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify GCP infrastructure
        run: |
          if ! gcloud artifacts repositories describe jula-evaluator \
              --project=${{ env.GCP_PROJECT_ID }} --location=${{ env.GCP_REGION }} \
              --quiet 2>/dev/null; then
            echo "::warning::GCP infrastructure not deployed. Skipping image tagging."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Tag Docker image with SemVer (GCP)
        if: env.SKIP_DEPLOY != 'true'
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-evaluator/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-evaluator/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.evaluator_tag }} \
            --quiet

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "evaluator/go.mod"
          cache: false

      - name: Build macOS Binary (ARM64)
        run: GOOS=darwin GOARCH=arm64 go build -o build/jula-evaluator-darwin-arm64 ./evaluator/cmd/evaluator

      - name: Build Linux Binary (AMD64)
        run: GOOS=linux GOARCH=amd64 go build -o build/jula-evaluator-linux-amd64 ./evaluator/cmd/evaluator

      - name: Build Windows Binary (AMD64)
        run: GOOS=windows GOARCH=amd64 go build -o build/jula-evaluator-windows-amd64.exe ./evaluator/cmd/evaluator

      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.evaluator_tag }} \
            build/jula-evaluator-darwin-arm64 \
            build/jula-evaluator-linux-amd64 \
            build/jula-evaluator-windows-amd64.exe

      - name: Attest Build Provenance (Evaluator Binaries)
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: |
            build/jula-evaluator-darwin-arm64
            build/jula-evaluator-linux-amd64
            build/jula-evaluator-windows-amd64.exe
