name: "Pipeline: Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Release Please (Monorepo)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and attest release binaries when Release Please creates a release.
  attest-binaries:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [collector, assessor, governor]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: ${{ matrix.component }}/go.mod

      - name: Build Binary
        run: |
          mkdir -p dist
          cd ${{ matrix.component }}
          if [ "${{ matrix.component }}" = "governor" ]; then
            for cmd_dir in cmd/*/; do
              cmd_name=$(basename "$cmd_dir")
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/governor-${cmd_name}-linux-amd64 ./${cmd_dir}
            done
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/${{ matrix.component }}-linux-amd64 ./cmd/...
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*-linux-amd64

      - name: Upload Binary to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 5 --json tagName,name -q ".[] | select(.name | contains(\"${{ matrix.component }}\")) | .tagName" | head -1)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" dist/*-linux-amd64 --clobber
          fi
