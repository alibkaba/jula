name: "CI/CD: Collector"

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - 'collector/**'
      - 'core/**'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: jula-collector
  IMAGE_NAME: jula
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "352486518067"

permissions: {}

jobs:
  # ==========================================
  # 1. TEST (Runs on PRs and Main)
  # ==========================================
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "collector/go.mod"
          cache: false
      - name: Run vet
        run: go vet ./collector/...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./collector/...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 65" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 65% threshold"
            exit 1
          fi

  # ==========================================
  # 2. BUILD CHECK (Runs on PRs only)
  # ==========================================
  build-check:
    name: Verify Build Image
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Dry Run Docker Build
        run: docker build -t test-jula-collector:latest -f collector/Dockerfile .

  # ==========================================
  # 3. BUILD (Single build, shared artifact)
  # ==========================================
  build:
    name: Build Image
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: docker build -t local-jula:latest -f collector/Dockerfile .

      - name: Save image as artifact
        run: docker save local-jula:latest | gzip > /tmp/jula-collector.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jula-collector-image
          path: /tmp/jula-collector.tar.gz
          retention-days: 1

  # ==========================================
  # 4. PUSH & DEPLOY (GCP)
  # ==========================================
  deploy-gcp:
    name: Push & Deploy GCP
    needs: build
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify GCP infrastructure
        run: |
          if ! gcloud artifacts repositories describe jula-collector \
              --project=${{ env.GCP_PROJECT_ID }} --location=${{ env.GCP_REGION }} \
              --quiet 2>/dev/null; then
            echo "::warning::GCP infrastructure not deployed. Skipping deploy."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Download image artifact
        if: env.SKIP_DEPLOY != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jula-collector-image
          path: /tmp

      - name: Load Docker image
        if: env.SKIP_DEPLOY != 'true'
        run: gunzip -c /tmp/jula-collector.tar.gz | docker load

      - name: Configure Docker for GCP
        if: env.SKIP_DEPLOY != 'true'
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Tag and Push (GCP)
        if: env.SKIP_DEPLOY != 'true'
        id: push-gcp
        run: |
          GCP_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker tag local-jula:latest ${GCP_TAG}:${{ github.sha }}
          DIGEST=$(docker push ${GCP_TAG}:${{ github.sha }} | grep -oP 'sha256:[a-f0-9]+')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${GCP_TAG}" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance (GCP Container Image)
        if: env.SKIP_DEPLOY != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.push-gcp.outputs.image }}
          subject-digest: ${{ steps.push-gcp.outputs.digest }}
          push-to-registry: true

      - name: Deploy to Cloud Run
        if: env.SKIP_DEPLOY != 'true'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.0
        with:
          service: jula-collector
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag as Latest (GCP)
        if: env.SKIP_DEPLOY != 'true'
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --quiet

  # ==========================================
  # 5. PUSH & DEPLOY (AWS)
  # ==========================================
  deploy-aws:
    name: Push & Deploy AWS
    needs: build
    if: vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS infrastructure
        run: |
          if ! aws ecr describe-repositories --repository-names jula-collector \
              --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "::warning::AWS infrastructure not deployed. Skipping deploy."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Download image artifact
        if: env.SKIP_DEPLOY != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jula-collector-image
          path: /tmp

      - name: Load Docker image
        if: env.SKIP_DEPLOY != 'true'
        run: gunzip -c /tmp/jula-collector.tar.gz | docker load

      - name: Login to Amazon ECR
        if: env.SKIP_DEPLOY != 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Tag and Push (AWS ECR)
        if: env.SKIP_DEPLOY != 'true'
        id: push-aws
        run: |
          ECR_TAG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/jula-collector"
          docker tag local-jula:latest ${ECR_TAG}:${{ github.sha }}
          docker tag local-jula:latest ${ECR_TAG}:latest
          DIGEST=$(docker push ${ECR_TAG}:${{ github.sha }} | grep -oP 'sha256:[a-f0-9]+')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${ECR_TAG}" >> $GITHUB_OUTPUT
          docker push ${ECR_TAG}:latest

      - name: Attest Build Provenance (AWS Container Image)
        if: env.SKIP_DEPLOY != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.push-aws.outputs.image }}
          subject-digest: ${{ steps.push-aws.outputs.digest }}
