name: "Analysis: CodeScene"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  codescene:
    name: CodeScene Delta Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run CodeScene Delta Analysis
        uses: empear-analytics/codescene-ci-cd@v2
        with:
          api-url: ${{ secrets.CODESCENE_API_URL }}
          api-token: ${{ secrets.CODESCENE_API_TOKEN }}
          delta-analysis-url: ${{ secrets.CODESCENE_DELTA_ANALYSIS_URL }}
          repository: ${{ github.repository }}
          coupling-threshold-percent: 50
          risk-threshold: 7
          fail-on-declining-code-health: false
          fail-on-failed-goal: false
