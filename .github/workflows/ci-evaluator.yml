name: "CI/CD: Evaluator"

on:
  push:
    branches: [main]
    paths:
      - 'evaluator/**'
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - 'evaluator/**'
      - 'core/**'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: jula-evaluator
  IMAGE_NAME: jula
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "352486518067"

permissions: {}

jobs:
  # ==========================================
  # 1. TEST (Runs on PRs and Main)
  # ==========================================
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "evaluator/go.mod"
          cache: false
      - name: Run vet
        run: go vet ./evaluator/...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./evaluator/...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 65" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 65% threshold"
            exit 1
          fi

  # ==========================================
  # 2. BUILD CHECK (Runs on PRs only)
  # ==========================================
  build-check:
    name: Verify Docker Build
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dry Run Docker Build
        run: docker build -t test-jula-evaluator:latest -f evaluator/Dockerfile .

  # ==========================================
  # 3. BUILD (Single build, shared artifact)
  # ==========================================
  build:
    name: Build Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Docker image
        run: docker build -t local-jula:latest -f evaluator/Dockerfile .

      - name: Save image as artifact
        run: docker save local-jula:latest | gzip > /tmp/jula-evaluator.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6db9a6b7e75b5161b5b31b56c61f8 # v4.6.2
        with:
          name: jula-evaluator-image
          path: /tmp/jula-evaluator.tar.gz
          retention-days: 1

  # ==========================================
  # 4. PUSH & DEPLOY (GCP)
  # ==========================================
  deploy-gcp:
    name: Push & Deploy GCP
    needs: build
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jula-evaluator-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/jula-evaluator.tar.gz | docker load

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Tag and Push (GCP)
        run: |
          GCP_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker tag local-jula:latest ${GCP_TAG}:${{ github.sha }}
          docker push ${GCP_TAG}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.0
        with:
          service: jula-evaluator
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag as Latest (GCP)
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --quiet

  # ==========================================
  # 5. PUSH & DEPLOY (AWS)
  # ==========================================
  deploy-aws:
    name: Push & Deploy AWS
    needs: build
    if: vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jula-evaluator-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/jula-evaluator.tar.gz | docker load

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Tag and Push (AWS ECR)
        run: |
          ECR_TAG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/jula-evaluator"
          docker tag local-jula:latest ${ECR_TAG}:${{ github.sha }}
          docker tag local-jula:latest ${ECR_TAG}:latest
          docker push ${ECR_TAG}:${{ github.sha }}
          docker push ${ECR_TAG}:latest
