name: Scheduled Canary Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - name: Build Collector
        run: go build -o jula-collector ./collector/cmd/collector

      - name: Build Evaluator
        run: go build -o jula-evaluator ./evaluator/cmd/evaluator

      - name: Execute Collector Canary Scan
        id: collector
        run: |
          ./jula-collector -output raw_findings.json
        continue-on-error: true

      - name: Execute Evaluator Policy Validation
        id: evaluator
        run: |
          ./jula-evaluator -findings raw_findings.json -policies governor/policies
        continue-on-error: true

      - name: Check for Schema Drift and Trigger Self-Healing
        if: steps.evaluator.outcome == 'failure' || steps.collector.outcome == 'failure'
        run: |
          echo "⚠️ Anomaly or schema drift detected! Initiating autonomous self-healing loop..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
