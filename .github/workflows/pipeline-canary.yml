name: "Pipeline: Canary"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    # actionlint-ignore: context access might be invalid
    if: vars.CANARY_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'governor/go.mod'

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - name: Build Collector
        run: mkdir -p bin && go build -o bin/jula-collector ./collector/cmd/collector

      - name: Build Assessor
        run: go build -o bin/jula-assessor ./assessor/cmd/assessor

      - name: Generate Ephemeral Signing Key Pair
        run: |
          openssl ecparam -genkey -name prime256v1 -noout -out /tmp/canary-signing-key.pem 2>/dev/null
          openssl ec -in /tmp/canary-signing-key.pem -pubout -out /tmp/canary-public-key.pem 2>/dev/null
          echo "JULA_SIGNING_KEY<<CANARY_EOF" >> $GITHUB_ENV
          cat /tmp/canary-signing-key.pem >> $GITHUB_ENV
          echo "CANARY_EOF" >> $GITHUB_ENV
          echo "JULA_PUBLIC_KEY<<CANARY_PUB_EOF" >> $GITHUB_ENV
          cat /tmp/canary-public-key.pem >> $GITHUB_ENV
          echo "CANARY_PUB_EOF" >> $GITHUB_ENV

      - name: Execute Collector Canary Scan
        id: collector
        env:
          JULA_INTEGRATION_DIR: governor/engine/integrations
          GITHUB_TOKEN: ${{ secrets.JULA_GITHUB_COLLECTOR_TOKEN }}
          JULA_SOURCE_TOKEN_ENV: GITHUB_TOKEN
          JULA_SOURCE_ORG: alibkaba
          JULA_ALLOWED_HOSTS: api.github.com,github.com
        run: |
          mkdir -p /tmp/canary-evidence
          ./bin/jula-collector run --output /tmp/canary-evidence
        continue-on-error: true

      - name: Execute Assessor Policy Validation
        id: assessor
        if: steps.collector.outcome == 'success' && hashFiles('/tmp/canary-evidence/manifest.json') != ''
        env:
          JULA_BUCKET_URL: /tmp/canary-evidence
          JULA_POLICY_URL: governor/policies
        run: |
          ./bin/jula-assessor run \
            --bucket-url "$JULA_BUCKET_URL" \
            --policy-url "$JULA_POLICY_URL"
        continue-on-error: true

      - name: Report Canary Results
        if: always()
        run: |
          echo "### Canary Results"
          echo "Collector: ${{ steps.collector.outcome }}"
          echo "Assessor: ${{ steps.assessor.outcome }}"
          if [ "${{ steps.collector.outcome }}" == "failure" ]; then
            echo "⚠️ Canary detected failures. Review logs above."
            exit 1
          fi
          if [ "${{ steps.assessor.outcome }}" == "failure" ]; then
            echo "⚠️ Canary detected failures. Review logs above."
            exit 1
          fi
          if [ "${{ steps.assessor.outcome }}" == "skipped" ]; then
            echo "ℹ️ Assessor skipped: no evidence was collected (all integrations lacked credentials)."
          fi
