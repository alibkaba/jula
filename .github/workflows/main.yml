name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. BUILD CHECK (Runs on PRs and Main)
  # ==========================================
  build-check:
    name: Verify CLI Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
          cache: false
      - name: Verify build generator
        run: cd cmd/build && go build -o /dev/null main.go
      - name: Verify translate generator
        run: cd cmd/translate && go build -o /dev/null main.go
