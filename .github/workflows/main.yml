name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: jula-evidence-collector
  IMAGE_NAME: jula
  AWS_REGISTRY: 352486518067.dkr.ecr.us-east-1.amazonaws.com
  AWS_REPOSITORY: jula-evidence-collector

jobs:
  # ==========================================
  # 1. TEST (Runs on PRs and Main)
  # ==========================================
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  # ==========================================
  # 2. PR BUILD CHECK (Runs ONLY on PRs)
  # ==========================================
  pr-build-check:
    name: Verify Docker Build
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dry Run Docker Build
        run: docker build -t test-jula:latest .

  # ==========================================
  # 3. BUILD & PUSH (Dual-Push: GCP + AWS)
  # ==========================================
  build-and-push:
    name: Build & Push Registries
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Build Docker image
        run: docker build -t local-jula:latest .

      - name: Tag and Push (GCP)
        run: |
          GCP_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker tag local-jula:latest ${GCP_TAG}:${{ github.sha }}
          docker push ${GCP_TAG}:${{ github.sha }}

      - name: Tag and Push (AWS)
        run: |
          AWS_TAG="${{ env.AWS_REGISTRY }}/${{ env.AWS_REPOSITORY }}"
          docker tag local-jula:latest ${AWS_TAG}:sha-${{ github.sha }}
          docker push ${AWS_TAG}:sha-${{ github.sha }}

  # ==========================================
  # 4. DEPLOY (GCP Cloud Run)
  # ==========================================
  deploy-gcp:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.0
        with:
          service: jula-evidence-collector
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag as Prod (GCP)
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:prod \
            --quiet

  # ==========================================
  # 5. RELEASE (Runs ONLY if Deploy succeeds)
  # ==========================================
  release:
    name: Release Please
    needs: deploy-gcp
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go

      # --- GCP SEMVER TAGGING ---
      - name: Authenticate to Google Cloud
        if: ${{ steps.release.outputs.release_created }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Tag Docker image with SemVer (GCP)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag_name }} \
            --quiet

      # --- AWS SEMVER TAGGING ---
      - name: Configure AWS Credentials
        if: ${{ steps.release.outputs.release_created }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Tag Docker image with SemVer (AWS)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name ${{ env.AWS_REPOSITORY }} \
            --image-ids imageTag=sha-${{ github.sha }} \
            --query 'images[0].imageManifest' \
            --output text)

          aws ecr put-image \
            --repository-name ${{ env.AWS_REPOSITORY }} \
            --image-tag ${{ steps.release.outputs.tag_name }} \
            --image-manifest "$MANIFEST"
