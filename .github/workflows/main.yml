name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: jula-evidence-collector
  IMAGE_NAME: jula
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 1. TEST (Runs on PRs and Main)
  # ==========================================
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

  # ==========================================
  # 2. DEPLOY (Dual-Push: GCP + AWS)
  # ==========================================
  build-and-deploy:
    name: Build, Push & Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGISTRY: 352486518067.dkr.ecr.us-east-2.amazonaws.com
      AWS_REPOSITORY: jula-evidence-collector

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --- Step 1: Authenticate to GCP ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@62ad5e4028190003973046f8841bb2ca6a6d6962 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # --- Step 2: Authenticate to AWS ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d44e03b006c # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b1d696f09139ff35f22c8309a969127c54a32 # v2.0.1

      # --- Step 3: Build Once ---
      - name: Build Docker image
        run: |
          docker build -t local-jula:latest .

      # --- Step 4 & 5: Tag & Push (Dual-Push) ---
      - name: Tag and Push (GCP)
        run: |
          GCP_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker tag local-jula:latest ${GCP_TAG}:${{ github.sha }}
          docker tag local-jula:latest ${GCP_TAG}:latest
          docker push ${GCP_TAG}:${{ github.sha }}
          docker push ${GCP_TAG}:latest

      - name: Tag and Push (AWS)
        run: |
          AWS_TAG="${{ env.AWS_REGISTRY }}/${{ env.AWS_REPOSITORY }}"
          # Apply the 'sha-' prefix required by ECR lifecycle policy
          docker tag local-jula:latest ${AWS_TAG}:sha-${{ github.sha }}
          docker push ${AWS_TAG}:sha-${{ github.sha }}

      # --- Step 6: Deploy GCP ---
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@0db7b469145610ec871c5305f6630f553335804a # v2.7.2
        with:
          service: jula-evidence-collector
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag as Prod (GCP)
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:prod \
            --quiet

  # ==========================================
  # 3. RELEASE (Runs ONLY if Deploy succeeds)
  # ==========================================
  release:
    name: Release Please
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Required for release-please to see git history
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go

      - name: Authenticate to Google Cloud
        if: ${{ steps.release.outputs.release_created }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Tag Docker image with SemVer
        if: ${{ steps.release.outputs.release_created }}
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag_name }} \
            --quiet
