name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. TEST (Runs on PRs and Main)
  # ==========================================
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  # ==========================================
  # 2. RELEASE (Runs on Main via Release Please)
  # ==========================================
  release:
    name: Release Please
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Build macOS Binary (ARM64)
        if: ${{ steps.release.outputs.release_created }}
        run: GOOS=darwin GOARCH=arm64 go build -o build/jula-evaluator-darwin-arm64 ./cmd/jula

      - name: Build Linux Binary (AMD64)
        if: ${{ steps.release.outputs.release_created }}
        run: GOOS=linux GOARCH=amd64 go build -o build/jula-evaluator-linux-amd64 ./cmd/jula

      - name: Build Windows Binary (AMD64)
        if: ${{ steps.release.outputs.release_created }}
        run: GOOS=windows GOARCH=amd64 go build -o build/jula-evaluator-windows-amd64.exe ./cmd/jula

      - name: Upload Release Artifacts
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            build/jula-evaluator-darwin-arm64 \
            build/jula-evaluator-linux-amd64 \
            build/jula-evaluator-windows-amd64.exe
