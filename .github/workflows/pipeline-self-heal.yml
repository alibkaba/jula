name: Jula Autopilot Self-Healing Loop

on:
  repository_dispatch:
    types: [schema_drift_detected] # Triggered by your cloud logger alert

jobs:
  heal_translation_map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize Go Environment
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - name: Write Temporary Breaking Cloud Payload
        run: |
          echo '${{ toJson(github.event.client_payload.raw_breaking_data) }}' > drift_payload.json

      - name: Execute Self-Healing Patch Script via AI Tier
        env:
          JULA_PRIMARY_ENDPOINT: ${{ secrets.JULA_PRIMARY_ENDPOINT }}
          JULA_PRIMARY_KEY: ${{ secrets.JULA_PRIMARY_KEY }}
          JULA_PRIMARY_MODEL: ${{ secrets.JULA_PRIMARY_MODEL }}
          JULA_MAX_RETRIES_PER_TIER: 2
        run: |
          cd governor/cmd/translate
          go run main.go \
            --provider "${{ github.event.client_payload.provider }}" \
            --service "${{ github.event.client_payload.service }}" \
            --sample-path "../../../drift_payload.json" \
            --heal

      - name: Validate AI-Generated Policy Compilation
        run: |
          cd governor/cmd/validate
          go run main.go

      - name: Commit and Push AI Changes
        run: |
          git config --global user.name "jula-ai-bot"
          git config --global user.email "bot@julacontrols.com"

          BRANCH_NAME="autopilot/patch-${{ github.event.client_payload.provider }}-${{ github.event.client_payload.service }}"
          git checkout -b $BRANCH_NAME

          git add governor/engine/translators/

          if git diff --staged --quiet; then
            echo "No schema changes generated by AI. Exiting gracefully."
            exit 0
          fi

          git commit -m "fix(ai): repair schema drift for ${{ github.event.client_payload.provider }} ${{ github.event.client_payload.service }}"
          git push -u origin $BRANCH_NAME

      - name: Open Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="autopilot/patch-${{ github.event.client_payload.provider }}-${{ github.event.client_payload.service }}"

          gh pr create \
            --title "🤖 Jula Autopilot: Remediation Patch for ${{ github.event.client_payload.provider }}_${{ github.event.client_payload.service }} Drift" \
            --body "### 🤖 Automated Schema Drift Remediation Report

            **System Alert:** A live production infrastructure scan pass flagged an unmapped structural variance matching a status of \`SCHEMA_DRIFT\`.

            * **Target System:** \`${{ github.event.client_payload.provider }}\`
            * **Service Layer:** \`${{ github.event.client_payload.service }}\`

            Jula has automatically generated a corrected data translator mapping file using \`governor/engine/prompts/02_heal_translator.md\`.

            Please review the side-by-side code diff below and merge to restore active security auditing." \
            --base main \
            --head $BRANCH_NAME \
            --label autopilot \
            --label schema-drift
