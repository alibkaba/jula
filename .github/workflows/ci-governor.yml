name: "CI/CD: Governor"

on:
  push:
    branches: [main]
    paths:
      - 'governor/**'
  pull_request:
    branches: [main]
    paths:
      - 'governor/**'
  workflow_dispatch:

permissions: {}

jobs:
  # ==========================================
  # 1. BUILD CHECK (Verify CLI Compilation)
  # ==========================================
  build-check:
    name: Verify CLI Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'governor/go.mod'
          cache: false
      - name: Verify build generator
        run: cd governor/cmd/build && go build -o /dev/null main.go
      - name: Verify translate generator
        run: cd governor/cmd/translate && go build -o /dev/null main.go
