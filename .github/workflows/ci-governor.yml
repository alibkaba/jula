name: "CI/CD: Governor"

on:
  push:
    branches: [main]
    paths:
      - 'governor/**'
  pull_request:
    branches: [main]
    paths:
      - 'governor/**'
  workflow_dispatch:

permissions: {}

jobs:
  # ==========================================
  # 1. BUILD CHECK (Verify CLI Compilation)
  # ==========================================
  build-check:
    name: Verify CLI Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'governor/go.mod'
          cache: false
      - name: Vet
        run: cd governor && go vet ./...
      - name: Test
        run: cd governor && go test -race -coverprofile=coverage.out -count=1 ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: governor/coverage.out
          flags: governor
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Verify import CLI
        run: cd governor && go build -o /dev/null ./cmd/import/
      - name: Verify translate CLI
        run: cd governor && go build -o /dev/null ./cmd/translate/
      - name: Verify build CLI
        run: cd governor && go build -o /dev/null ./cmd/build/
      - name: Verify validate CLI
        run: cd governor && go build -o /dev/null ./cmd/validate/

  # ==========================================
  # 2. SIGN POLICY BUNDLE (Main only, policy/engine changes)
  # ==========================================
  sign-policy-bundle:
    name: Sign Policy Bundle
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Check if policies or engine changed
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          if echo "$CHANGED" | grep -qE '^governor/(policies|engine)/'; then
            echo "should_sign=true" >> $GITHUB_OUTPUT
          else
            echo "should_sign=false" >> $GITHUB_OUTPUT
            echo "No policy or engine changes detected. Skipping signing."
          fi

      - name: Create Policy Bundle Tarball
        if: steps.check.outputs.should_sign == 'true'
        id: bundle
        run: |
          BUNDLE_FILE="governor-policy-bundle.tar.gz"
          tar -czf "${BUNDLE_FILE}" governor/policies/ governor/engine/
          BUNDLE_HASH=$(sha256sum "${BUNDLE_FILE}" | awk '{print $1}')
          echo "bundle_file=${BUNDLE_FILE}" >> $GITHUB_OUTPUT
          echo "bundle_hash=${BUNDLE_HASH}" >> $GITHUB_OUTPUT
          echo "Policy bundle hash: ${BUNDLE_HASH}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.check.outputs.should_sign == 'true'
        with:
          go-version-file: "core/go.mod"
          cache: false

      - name: Sign Policy Bundle (Key B)
        if: steps.check.outputs.should_sign == 'true'
        env:
          JULA_POLICY_SIGNING_KEY: ${{ secrets.JULA_POLICY_SIGNING_KEY }}
        run: |
          if [ -z "${JULA_POLICY_SIGNING_KEY}" ]; then
            echo "::error::JULA_POLICY_SIGNING_KEY secret is not configured"
            exit 1
          fi

          # Build and run the signing tool inline via Go.
          # This uses the same crypto.SignBundle function from core/pkg/crypto/bundle.go.
          go run -C core ./cmd/jula-sign-bundle \
            --bundle-hash "${{ steps.bundle.outputs.bundle_hash }}" \
            --key-env "JULA_POLICY_SIGNING_KEY" \
            --output "../bundle-manifest.json"

          echo "Signed bundle-manifest.json:"
          cat bundle-manifest.json

      - name: Upload Policy Bundle Artifacts
        if: steps.check.outputs.should_sign == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governor-policy-bundle
          path: |
            ${{ steps.bundle.outputs.bundle_file }}
            bundle-manifest.json
          retention-days: 90
