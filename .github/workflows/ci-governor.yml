name: "CI/CD: Governor"

on:
  push:
    branches: [main]
    paths:
      - 'governor/**'
  pull_request:
    branches: [main]
    paths:
      - 'governor/**'

permissions: {}

jobs:
  # ==========================================
  # 1. BUILD CHECK (Verify CLI Compilation)
  # ==========================================
  build-check:
    name: Verify CLI Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
          cache: false
      - name: Verify build generator
        run: cd governor/cmd/build && go build -o /dev/null main.go
      - name: Verify translate generator
        run: cd governor/cmd/translate && go build -o /dev/null main.go
