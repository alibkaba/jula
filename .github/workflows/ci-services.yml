name: "CI/CD: Services"

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'assessor/**'
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - 'collector/**'
      - 'assessor/**'
      - 'core/**'
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build and deploy"
        type: choice
        options:
          - both
          - collector
          - assessor
        default: both

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: jula
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "352486518067"

permissions: {}

jobs:
  # ==========================================
  # 0. DETECT CHANGES
  # ==========================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Determine services to build
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            CHOICE="$INPUT_SERVICE"
            if [ "$CHOICE" == "both" ] || [ -z "$CHOICE" ]; then
              echo 'services=["collector","assessor"]' >> $GITHUB_OUTPUT
            else
              echo "services=[\"$CHOICE\"]" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          SERVICES="[]"
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          CORE_CHANGED=false
          COLLECTOR_CHANGED=false
          ASSESSOR_CHANGED=false

          for FILE in $CHANGED; do
            case "$FILE" in
              core/*) CORE_CHANGED=true ;;
              collector/*) COLLECTOR_CHANGED=true ;;
              assessor/*) ASSESSOR_CHANGED=true ;;
            esac
          done

          # Core changes affect both services
          if [ "$CORE_CHANGED" == "true" ]; then
            COLLECTOR_CHANGED=true
            ASSESSOR_CHANGED=true
          fi

          if [ "$COLLECTOR_CHANGED" == "true" ] && [ "$ASSESSOR_CHANGED" == "true" ]; then
            SERVICES='["collector","assessor"]'
          elif [ "$COLLECTOR_CHANGED" == "true" ]; then
            SERVICES='["collector"]'
          elif [ "$ASSESSOR_CHANGED" == "true" ]; then
            SERVICES='["assessor"]'
          fi

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Detected services: $SERVICES"

  # ==========================================
  # 1. TEST
  # ==========================================
  test:
    name: "Test: ${{ matrix.service }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "${{ matrix.service }}/go.mod"
          cache: false
      - name: Run vet
        run: go vet ./${{ matrix.service }}/...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./${{ matrix.service }}/...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 65" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 65% threshold"
            exit 1
          fi

  # ==========================================
  # 2. BUILD CHECK (PRs only)
  # ==========================================
  build-check:
    name: "Verify Build: ${{ matrix.service }}"
    needs: [test, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Dry Run Docker Build
        run: docker build -t test-jula-${{ matrix.service }}:latest -f ${{ matrix.service }}/Dockerfile .

  # ==========================================
  # 3. BUILD (Main/Dispatch only)
  # ==========================================
  build:
    name: "Build: ${{ matrix.service }}"
    needs: [test, detect-changes]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: docker build -t local-jula:latest -f ${{ matrix.service }}/Dockerfile .

      - name: Save image as artifact
        run: docker save local-jula:latest | gzip > /tmp/jula-${{ matrix.service }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jula-${{ matrix.service }}-image
          path: /tmp/jula-${{ matrix.service }}.tar.gz
          retention-days: 1

  # ==========================================
  # 4. PUSH & DEPLOY (GCP)
  # ==========================================
  deploy-gcp:
    name: "Deploy GCP: ${{ matrix.service }}"
    needs: [build, detect-changes]
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth-gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Verify GCP infrastructure
        run: |
          if ! gcloud artifacts repositories describe jula-${{ matrix.service }} \
              --project=${{ env.GCP_PROJECT_ID }} --location=${{ env.GCP_REGION }} \
              --quiet 2>/dev/null; then
            echo "::error::GCP Artifact Registry repository jula-${{ matrix.service }} not found. Is infrastructure deployed?"
            exit 1
          fi

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jula-${{ matrix.service }}-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/jula-${{ matrix.service }}.tar.gz | docker load

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet
          echo '${{ steps.auth-gcp.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin https://${{ env.ARTIFACT_REGISTRY }}

      - name: Tag and Push (GCP)
        id: push-gcp
        run: |
          GCP_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-${{ matrix.service }}/${{ env.IMAGE_NAME }}"
          docker tag local-jula:latest ${GCP_TAG}:${{ github.sha }}
          docker push ${GCP_TAG}:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${GCP_TAG}:${{ github.sha }} | cut -d@ -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${GCP_TAG}" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance (GCP Container Image)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.push-gcp.outputs.image }}
          subject-digest: ${{ steps.push-gcp.outputs.digest }}
          push-to-registry: false

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.0
        with:
          service: jula-${{ matrix.service }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-${{ matrix.service }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--no-allow-unauthenticated --ingress internal-and-cloud-load-balancing'

      - name: Tag as Latest (GCP)
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-${{ matrix.service }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/jula-${{ matrix.service }}/${{ env.IMAGE_NAME }}:latest \
            --quiet

  # ==========================================
  # 5. PUSH & DEPLOY (AWS)
  # ==========================================
  deploy-aws:
    name: "Deploy AWS: ${{ matrix.service }}"
    needs: [build, detect-changes]
    if: vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS infrastructure
        run: |
          if ! aws ecr describe-repositories --repository-names jula-${{ matrix.service }} \
              --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "::error::AWS ECR repository jula-${{ matrix.service }} not found. Is infrastructure deployed?"
            exit 1
          fi

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jula-${{ matrix.service }}-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/jula-${{ matrix.service }}.tar.gz | docker load

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Tag and Push (AWS ECR)
        id: push-aws
        run: |
          ECR_TAG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/jula-${{ matrix.service }}"
          docker tag local-jula:latest ${ECR_TAG}:${{ github.sha }}
          docker tag local-jula:latest ${ECR_TAG}:latest
          docker push ${ECR_TAG}:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${ECR_TAG}:${{ github.sha }} | cut -d@ -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${ECR_TAG}" >> $GITHUB_OUTPUT
          docker push ${ECR_TAG}:latest

      - name: Attest Build Provenance (AWS Container Image)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.push-aws.outputs.image }}
          subject-digest: ${{ steps.push-aws.outputs.digest }}
