name: "CI/CD: Core Library"

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
  workflow_dispatch:

permissions: {}

jobs:
  # ==========================================
  # 1. TEST (Runs on PRs and Main)
  # ==========================================
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "core/go.mod"
          cache: false
      - name: Run vet
        run: go vet ./core/...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./core/...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 65" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 65% threshold"
            exit 1
          fi

  # ==========================================
  # 2. BUILD CHECK (Verify Compilation)
  # ==========================================
  build-check:
    name: Verify Go Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "core/go.mod"
          cache: false
      - name: Verify Compilation
        run: go build ./core/...

  # ==========================================
  # 3. RELEASE (Semantic Tagging)
  # ==========================================
  release:
    name: Release Please
    needs: build-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go
