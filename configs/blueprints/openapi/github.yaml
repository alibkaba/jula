vendor_name: "github"
base_url: "https://api.github.com"
auth_flow:
  type: "bearer"
  token_env: "GITHUB_TOKEN"
endpoints:
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}/commits?per_page=50":
    erl_id: "E-AST-22"
    description: "GitHub Repository Commit Provenance"
    headers:
      Accept: "application/vnd.github.v3+json"
    pagination:
      next_url_field: "header.Link"
      max_pages: 5
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}":
    erl_id: "E-CHG-01"
    description: "GitHub Repository Metadata"
    headers:
      Accept: "application/vnd.github.v3+json"
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}/branches/main/protection":
    erl_id: "E-CHG-02"
    description: "GitHub Branch Protection Rules"
    headers:
      Accept: "application/vnd.github.v3+json"
    allow_404: true
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}/pulls?state=all&per_page=100&sort=updated&direction=desc":
    erl_id: "E-CHG-03"
    description: "GitHub Recent Pull Requests"
    headers:
      Accept: "application/vnd.github.v3+json"
    pagination:
      next_url_field: "header.Link"
      max_pages: 5
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}/contents/CODEOWNERS":
    erl_id: "E-CHG-04"
    description: "GitHub CODEOWNERS File"
    headers:
      Accept: "application/vnd.github.v3+json"
    allow_404: true
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}/pulls?state=closed&per_page=100":
    erl_id: "E-CHG-05"
    description: "GitHub Closed and Merged Pull Requests"
    headers:
      Accept: "application/vnd.github.v3+json"
    pagination:
      next_url_field: "header.Link"
      max_pages: 5
  "/orgs/${GITHUB_ORG}/members?role=admin&per_page=100":
    erl_id: "E-IAM-03"
    description: "GitHub Organization Administrators"
    headers:
      Accept: "application/vnd.github.v3+json"
    allow_404: true
  "/repos/${GITHUB_ORG}/${GITHUB_REPO}/collaborators?per_page=100":
    erl_id: "E-MON-03"
    description: "GitHub Repository Collaborators and Privileged Users"
    headers:
      Accept: "application/vnd.github.v3+json"
